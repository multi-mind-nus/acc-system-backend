name: Test and publish backend images

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      nginx: ${{ steps.filter.outputs.nginx }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app/**'
              - 'migrations/**'
              - 'tests/**'
              - 'alembic.ini'
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/build-image.yml'
            nginx:
              - 'deploy/nginx/**'
              - '.github/workflows/build-image.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Test
        run: |
          uv sync --frozen
          uv run pytest
      - name: Build
        run: docker build --build-arg APP_VERSION="$GITHUB_SHA" --tag acc-system-backend:test .
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        if: github.event_name == 'push'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Push to ECR
        if: github.event_name == 'push'
        env:
          REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          docker tag acc-system-backend:test "$registry/$REPOSITORY:$GITHUB_SHA"
          docker tag acc-system-backend:test "$registry/$REPOSITORY:main"
          docker push "$registry/$REPOSITORY:$GITHUB_SHA"
          docker push "$registry/$REPOSITORY:main"

  nginx:
    needs: changes
    if: needs.changes.outputs.nginx == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --tag acc-system-nginx:test deploy/nginx
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        if: github.event_name == 'push'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Push to ECR
        if: github.event_name == 'push'
        env:
          REPOSITORY: ${{ vars.ECR_NGINX_REPOSITORY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          docker tag acc-system-nginx:test "$registry/$REPOSITORY:$GITHUB_SHA"
          docker tag acc-system-nginx:test "$registry/$REPOSITORY:main"
          docker push "$registry/$REPOSITORY:$GITHUB_SHA"
          docker push "$registry/$REPOSITORY:main"
